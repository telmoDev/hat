name: smoke

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the update tests scaffold a workspace from the v0.7.0 tag
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fast local name lookups (macOS runner)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          # On the macOS runner a reverse lookup of 127.0.0.1 takes ~35 s (measured), and http.server's HTTPServer
          # does one per start: the benchmark fixture's server took the job from ~40 s to ~11 min. Name the runner
          # locally, then check it: fail here, fast, if a lookup is still slow.
          echo "127.0.0.1 localhost $(hostname) $(hostname -s)" | sudo tee -a /etc/hosts >/dev/null
          python -c "import socket, sys, time; t = time.time(); socket.getfqdn('127.0.0.1'); d = time.time() - t; print('getfqdn %.2f s' % d); sys.exit(d > 2)"
      - name: Scaffold a workspace and run the gate
        shell: bash
        run: bash tests/smoke.sh

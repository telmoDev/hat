# Shared by Claude Code and Codex: read by the scripts and hooks in .orchestrator/ and by the pre-pr-review skill.
# REPOS: space-separated directories under the workspace root ("." = the root itself).
REPOS="{{REPOS}}"
# The orchestrator-setup release this workspace was scaffolded or last updated with (CHANGELOG.md of the skill
# says what changed since). Absent: set up before v0.1.0, when everything lived under .claude/.
TEMPLATE_VERSION="{{VERSION}}"
# "off": the SessionStart hook update-check.sh stays silent. Otherwise it says when a newer orchestrator release
# is out (looked up in the background, once a day) or this workspace is behind the installed one.
UPDATE_CHECK="{{UPDATE_CHECK}}"
# "off": the telemetry hooks record nothing. Otherwise they keep local operational metadata (runs, agent runs,
# reported usage; never prompts or file content) in .orchestrator/telemetry/telemetry.db, without model calls.
TELEMETRY="on"
# "off": a Claude Code subagent's tokens are recorded as unavailable instead of read from its transcript when it
# stops (a private format, read strictly: anything unrecognized also gives unavailable; never its content).
TELEMETRY_TRANSCRIPTS="on"
# "off": no session handoff. Otherwise a session that ends without updating memory/ leaves a short draft of where
# it stopped (branches, uncommitted files, active task files; from local git, never file contents) in
# .orchestrator/tmp/handoff/, shown once at the next session start.
SESSION_HANDOFF="on"
# Each repo's base branch, as space-separated <repo>=<branch>. memory-state.sh reports its last commit.
BASE_BRANCHES="{{BASES}}"
# Words the four memory files may hold together before memory-check warns.
WORD_BUDGET=1200
# Optional: a wrapper that runs git with the right credentials, called as "<wrapper> <repo> <git args>".
GIT_WRAPPER=""
# "no": the orchestration layer is not versioned; /sync-memory skips its commit step.
ROOT_GIT="{{ROOT_GIT}}"
# Optional: a regex every PR body must match (e.g. '^Jira: PROJ-[0-9]+'); push-pr.sh refuses a body without it.
TICKET_LINE=""
# Optional: per repo, the branch its PRs open into when it isn't the base they branch from, as space-separated
# <repo>=<branch> (e.g. "api=develop"). push-pr.sh opens the PR there and never pushes it; memory-state.sh never
# lists it for cleanup.
PR_TARGETS=""
# Optional: the gh account this project's repos need, when it isn't the active one (gh auth login --user …).
# push-pr.sh and memory-state.sh run gh with its token; nothing else changes.
GH_USER=""
# Optional: the ticket system every task gets a ticket in, and its project or board key, e.g. TICKETS="jira"
# TICKET_PROJECT="PROJ", or TICKETS="github" (the repo's issues). Empty: no tickets. AGENTS.md › Tickets.
TICKETS=""
TICKET_PROJECT=""
# Optional PR title rules push-pr.sh enforces: a regex the title must match, and a maximum length. Empty: no
# check. Set from the repos' own convention, e.g. Conventional Commits:
#   TITLE_PATTERN='^[a-z]+(\([^)]+\))?!?: [^ ]' TITLE_MAX=72
TITLE_PATTERN=""
TITLE_MAX=""
# "refuse": push-pr.sh refuses AI attribution (a Co-Authored-By naming an AI tool, "Generated with <tool>") in the
# PR body and the commits. A Co-Authored-By naming a person passes.
# Empty: no check.
ATTRIBUTION=""
# "strict": pre-pr-pass.sh refuses a branch where a code commit has no test commit before it (TDD).
# "off": no check. A single branch skips it with TDD_EXEMPT="<reason>" pre-pr-pass.sh <repo> <branch>.
TDD="strict"
# With TDD="strict": the extended regexes that tell a test commit and a code commit apart by their subject.
# The defaults read Conventional Commits; match them to the repos' convention.
TDD_TEST_COMMIT='^test(\(|:|!)'
TDD_CODE_COMMIT='^(feat|fix)(\(|:|!)'
# Optional: the repos the TDD check applies to (space-separated); empty means all. Leave out a repo with no tests.
TDD_REPOS=""
# Optional: check only commits made from this moment on ("YYYY-MM-DD" = its midnight, or "YYYY-MM-DD HH:MM"),
# when adopting TDD with branches already open.
TDD_SINCE=""
# Optional, for the SessionStart decision index: a directory with one markdown file per ADR, and a
# decision log whose entries are "## " headings with a "**Status:**" line. Paths relative to the root.
ADR_DIR=""
DECISION_LOG=""
# Skills in .agents/skills that sync-skills.sh does not copy to .claude/skills (Claude Code has its own equivalent).
CODEX_ONLY_SKILLS="pre-pr-review"
